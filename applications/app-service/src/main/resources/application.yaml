##Spring Configuration
server:
  port: 8081
spring:
  application:
    name: Taller14
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: /h2
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/testdb
    username: postgres
    password: postgres
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
  sql:
    init:
      mode: always
      encoding: UTF-8
  profiles:
    include:

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
