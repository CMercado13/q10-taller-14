server:
  port: 8081
spring:
  application:
    name: "Taller14"
  devtools:
    add-properties: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/test_db
    username: postgres
    password: postgres
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
  sql:
    init:
      mode: "always"
      encoding: "UTF-8"
  profiles:
    include: null
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapter:
  restconsumer:
    url: "http://localhost:8081"     # los /external/** viven en esta misma app